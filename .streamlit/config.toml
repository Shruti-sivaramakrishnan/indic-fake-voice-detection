# Forces Streamlit's OWN theme (native widget backgrounds/text -- file
# uploader, expander, selectbox, json viewer, etc.) to a fixed light theme
# regardless of the visitor's OS/browser dark-mode preference.
#
# This is the root-cause fix for a real bug: without this, Streamlit paints
# several of its own structural containers with ITS dark-theme background
# (near-black) when a visitor's browser prefers dark, while our own CSS
# assumed a light page -- producing genuinely unreadable text in specific
# native widgets under system dark mode. Confirmed via a real rendered-DOM
# audit (Playwright + Chromium), not assumed.
[theme]
base = "light"
primaryColor = "#665CF6"
backgroundColor = "#F6F7FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans-serif"

[server]
maxUploadSize = 25
maxMessageSize = 25
